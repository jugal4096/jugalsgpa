<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GECA CGPA Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="index.css" />
</head>

<body>

  <!-- 🎥 Background -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="Animated_Character_Video_Generation.mp4" type="video/mp4" />
  </video>
  <div class="bg-overlay"></div>

  <!-- 🔐 Auth corner -->
  <div class="auth-corner">

    <div id="authButtons">
      <button id="loginBtn" class="auth-btn">Login</button>
      <button id="registerBtn" class="auth-btn accent-btn">Register</button>
    </div>

    <div class="profile-badge hidden" id="profileBadge">
      <span id="profileInitial">U</span>
    </div>
  </div>

  <!-- 👤 Profile Panel -->
  <div class="profile-panel hidden" id="profilePanel">
    <button id="editProfileBtn">✏️ Edit Profile</button>
    <button id="logoutBtn" class="danger">🚪 Logout</button>
  </div>

  <!-- 🚨 Semester Limit Popup -->
  <div class="popup-overlay hidden" id="limitPopup">
    <div class="popup-card">
      <img src="ChatGPT Image Jan 3, 2026, 09_44_42 AM.gif" class="popup-mascot" />
      <h3>Hey dude 😅</h3>
      <p></p>
      <button id="closePopup">Got it 👍</button>
    </div>
  </div>

  <!-- ================= MAIN ================= -->
  <div class="container">

    <h2>GECA CGPA Calculator</h2>

    <table id="cgpa-table">
      <thead>
        <tr>
          <th>Semester</th>
          <th>Credits</th>
          <th>SGPA</th>
          <th>❌</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <button id="add-sem">➕ Add Semester</button>

    <div id="cgpa-result">CGPA: 0.00</div>

    <div class="nav-group">
      <a href="#" class="nav-btn secondary" id="goToSgpaBtn">
        ⬅ Go to SGPA
      </a>
      <a href="dashboard.html" class="nav-btn">
        🏠 Home
      </a>
    </div>

  </div>

  <script type="module" src="cgpa.js"></script>
</body>
</html>
